mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

server:
  servlet:
    context-path: /api
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false
  port: 8080


logging:
  level:
    org.victor.stackora.mapper: DEBUG
