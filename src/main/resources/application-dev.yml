mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl


logging:
  level:
    org.victor.stackora.mapper: DEBUG

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: org.victor.stackora.controller

